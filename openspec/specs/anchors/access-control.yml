# ast-grep anchors for openspec/specs/access-control/spec.md

access.list-filter:
  rule:
    kind: function_definition
    has: { field: name, regex: '^on_list_tools$' }
    inside:
      kind: class_definition
      has: { field: name, regex: '^GroupTagFilter$' }
      stopBy: end
  files: [src/**/*.py]

access.call-block:
  rule:
    kind: function_definition
    has: { field: name, regex: '^on_call_tool$' }
    inside:
      kind: class_definition
      has: { field: name, regex: '^GroupTagFilter$' }
      stopBy: end
  files: [src/**/*.py]

access.cleared-for:
  rule:
    kind: function_definition
    has: { field: name, regex: '^cleared_for$' }
  files: [src/**/*.py]
