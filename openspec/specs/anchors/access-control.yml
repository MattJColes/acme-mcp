# ast-grep anchors for openspec/specs/access-control/spec.md

access.list-filter:
  rule:
    kind: function_definition
    has: { field: name, regex: '^build_access_middleware$' }
  files: [src/**/*.py]

access.call-block:
  rule:
    kind: function_definition
    has: { field: name, regex: '^build_access_middleware$' }
  files: [src/**/*.py]

access.cleared-for:
  rule:
    kind: function_definition
    has: { field: name, regex: '^group_access$' }
  files: [src/**/*.py]
